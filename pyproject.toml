[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-link-auditor"
version = "0.1.0"
description = "A lightweight CLI for auditing links in Markdown knowledge bases."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["markdown-it-py>=3.0,<5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
markdown-auditor = "markdown_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["markdown_auditor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
